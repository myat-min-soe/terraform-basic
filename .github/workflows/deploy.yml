name: Terraform CI

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Manual stage to run"
        required: true
        type: choice
        options:
          - validate
          - plan
          - apply
        default: validate

permissions:
  contents: read
  actions: read

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: "1.12.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: ./terraform

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: github.event.inputs.stage == 'validate'

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init (no backend)
        run: terraform init -backend=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Validate
        run: terraform validate -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}

  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event.inputs.stage == 'plan'
    environment: develop

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create terraform.tfvars
        run: |
          cat <<EOF > terraform.tfvars
          ${{ secrets.TFVARS_FILE }}
          EOF
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Plan
        run: terraform plan -out=terraform.tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/terraform.tfplan
          retention-days: 7
          if-no-files-found: error

  apply:
    name: Apply
    runs-on: ubuntu-latest
    if: github.event.inputs.stage == 'apply'
    environment: develop

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download latest plan artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow "${{ github.workflow }}" \
            --branch "${{ github.ref_name }}" \
            --json databaseId \
            --jq 'map(select(. != null)) | first // empty')
          
          if [ -z "$RUN_ID" ]; then
            echo "No previous workflow runs found."
            exit 1
          fi
          
          gh run download "$RUN_ID" -n tfplan -D "${{ env.TF_WORKING_DIR }}"
          
          if [ ! -f "${{ env.TF_WORKING_DIR }}/terraform.tfplan" ]; then
            echo "Plan artifact not found in run $RUN_ID"
            exit 1
          fi
          
          echo "Downloaded plan from run $RUN_ID"

      - name: Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Apply
        run: terraform apply -auto-approve terraform.tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
